name: "Upload artifact v3-node20"
description: "Internal helper action for GHES artifact upload."

inputs:
  name:
    description: "Name of the artifact"
    required: true
  path:
    description: "Path to the artifact"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d # v3-node20
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
