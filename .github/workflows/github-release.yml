name: "GitHub Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the release (e.g. 1.2.3)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  create-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true # Needed to push the changelog branch

      - name: Set up Node for the changelog formatter
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Prepare automated changelog commits
        run: |
          npm ci --ignore-scripts
          sh .internal-tools/prepare-changelog-commit.sh

      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@5f7b17d84004804cb3d7ba38f283965643107870 # main
        with:
          ci-workflows: "none"
          tag-template: "v<version>"
          version: ${{ inputs.version }}
