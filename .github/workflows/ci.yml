name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
jobs:
  ci:
    runs-on:
      - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Install Node dependencies
        run: npm ci --engine-strict

      - name: Check Node tooling
        run: |
          npm run prettier:ci
          npm run lint:staged -- --version

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install yamllint
        run: python -m pip install --upgrade pip yamllint

      - name: yamllint
        run: yamllint -c .yamllint.yml -f parsable .

      - name: actionlint
        uses: devops-actions/actionlint@216abcda9203ffeaeb953db1b151c94e1927c5bf # v1.0.0
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
