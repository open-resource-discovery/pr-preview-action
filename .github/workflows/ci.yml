name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on:
      - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check tooling on current Node
        run: |
          npm run prettier:ci
          npm run lint:staged -- --version

      - name: Read minimum supported Node version
        id: node-minimum
        run: |
          node -p '"version=" + require("./package.json").engines.node.match(/^>=(\d+\.\d+\.\d+)$/)[1]' >> "$GITHUB_OUTPUT"

      - name: Setup minimum supported Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-minimum.outputs.version }}
          cache: npm

      - name: Check tooling on minimum supported Node
        run: |
          npm ci
          npm run prettier:ci
          npm run lint:staged -- --version

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install yamllint
        run: python -m pip install --upgrade pip yamllint

      - name: yamllint
        run: yamllint -c .yamllint.yml -f parsable .

      - name: actionlint
        uses: devops-actions/actionlint@33c4280e46dd7578b21b0fbbfd19fe8063f68291 # v1.0.1

      - name: REUSE lint
        uses: fsfe/reuse-action@v6

      - name: Python unit tests
        run: python -m unittest discover -s tests -v
