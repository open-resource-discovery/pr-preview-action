name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}
jobs:
  ci:
    permissions:
      contents: read
    runs-on:
      - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check workflow security
        run: pipx run --spec zizmor==1.33.1 zizmor --offline --no-progress --format github --min-severity medium .github/workflows action.yml

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.21.3 --registry=https://registry.npmjs.org/

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --engine-strict

      - name: Check Node tooling
        run: |
          npm run prettier:ci
          npm run lint:staged -- --version

      - name: JavaScript tests and bundle check
        run: |
          npm run build:worker
          npm test
          git diff --exit-code -- .internal-tools/trusted-preview.bundle.mjs .internal-tools/trusted-preview.bundle.mjs.LEGAL.txt

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install yamllint
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r .internal-tools/requirements-yamllint.txt

      - name: yamllint
        run: yamllint -c .yamllint.yml -f parsable .

      - name: actionlint
        uses: devops-actions/actionlint@1127887bc5b38beddaafc906b5f293430ef6d255 # v2.0.1
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up minimum Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Test published preview bundle on Node.js 20
        env:
          TEST_WORKER_BUNDLE: "1"
        run: node --test tests/worker.test.mjs
