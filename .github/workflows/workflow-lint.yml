name: Workflow Security

on:
  pull_request:
    paths:
      - .github/**
      - action.yml
      - .internal-actions/upload-artifact-v3-node20/action.yml
      - .internal-actions/upload-artifact-v4/action.yml
      - renovate.json
      - .internal-actions/**
      - .internal-tools/**
  push:
    branches: [main]
    paths:
      - .github/**
      - action.yml
      - .internal-actions/upload-artifact-v3-node20/action.yml
      - .internal-actions/upload-artifact-v4/action.yml
      - renovate.json
      - .internal-actions/**
      - .internal-tools/**
permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow security
        run: pipx run --spec zizmor==1.33.1 zizmor --offline --no-progress --format github --min-severity medium .github/workflows action.yml .internal-actions/upload-artifact-v3-node20/action.yml .internal-actions/upload-artifact-v4/action.yml
